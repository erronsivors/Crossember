.wv{animation:wv 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
@keyframes wv{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:.8s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.2);opacity:1}}
</style>
