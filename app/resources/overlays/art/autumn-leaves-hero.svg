<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.lf{animation:fall 3.4s ease-in infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.l2{animation-delay:1.1s}.l3{animation-delay:2.2s}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(30px,120px) rotate(200deg);opacity:0}}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
