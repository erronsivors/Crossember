<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.fl{animation:fl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.f2{animation-delay:.3s}.f3{animation-delay:.6s}
@keyframes fl{0%,100%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.85,1.15) rotate(3deg)}}
.cf{animation:cf 3s linear infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.c2{animation-delay:1s}.c3{animation-delay:2s}
@keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(50px) rotate(240deg);opacity:0}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
