.nt{animation:nt 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.n2{animation-delay:.9s}.n3{animation-delay:1.8s}
@keyframes nt{0%{transform:translateY(20px) rotate(-8deg);opacity:0}30%{opacity:1}100%{transform:translateY(-50px) rotate(8deg);opacity:0}}
</style>
