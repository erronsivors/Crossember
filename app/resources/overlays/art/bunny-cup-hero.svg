<style>
.ear{animation:ear 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.e2{animation-delay:.5s}
@keyframes ear{0%,80%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}}
.eye{animation:blink 3.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.st{animation:rise 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.s2{animation-delay:1.3s}
@keyframes rise{0%{transform:translateY(15px) scaleY(.6);opacity:0}30%{opacity:.85}100%{transform:translateY(-30px) scaleY(1.1);opacity:0}}
</style>
