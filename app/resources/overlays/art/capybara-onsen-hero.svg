<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.st{animation:rise 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes rise{0%{transform:translateY(20px) scaleY(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-40px) scaleY(1.1);opacity:0}}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.org{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
</style>
