<path d="M290 310h870" fill="none" stroke="#ff6a2a" stroke-width="10"/>
<path d="M340 340h760l-24 30H364z" fill="#3b3b3b" stroke-width="6"/>
<circle cx="70" cy="60" r="9" fill="#fff0d6" stroke-width="5"/><circle cx="70" cy="340" r="9" fill="#fff0d6" stroke-width="5"/>
<circle cx="1130" cy="60" r="9" fill="#fff0d6" stroke-width="5"/><circle cx="1130" cy="340" r="9" fill="#fff0d6" stroke-width="5"/>
</g>
<g fill="#2a2a2a" stroke="none">
