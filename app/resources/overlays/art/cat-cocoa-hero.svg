<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.steam{animation:rise 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:.0}
.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(20px) scaleY(.6);opacity:0}30%{opacity:.85}100%{transform:translateY(-40px) scaleY(1.1);opacity:0}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tail{animation:wag 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 90%}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
</style>
