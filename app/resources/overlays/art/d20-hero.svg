<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" shape-rendering="crispEdges">
<style>
.rl{animation:rl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes rl{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sp{animation:sp 1.6s steps(2) infinite}.s2{animation-delay:.8s}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.1}}
</style>
<rect x="120" y="540" width="360" height="20" fill="#000" opacity=".25"/>
<g class="rl">
<rect x="260" y="60" width="80" height="40" fill="#7a0f1e"/><rect x="200" y="100" width="200" height="40" fill="#7a0f1e"/><rect x="140" y="140" width="320" height="60" fill="#7a0f1e"/>
