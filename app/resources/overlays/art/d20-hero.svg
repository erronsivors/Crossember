<rect x="280" y="80" width="40" height="20" fill="#ff4d5e"/><rect x="220" y="100" width="160" height="40" fill="#ff4d5e"/><rect x="160" y="140" width="280" height="40" fill="#ff4d5e"/>
<rect x="120" y="200" width="360" height="200" fill="#ff4d5e"/><rect x="160" y="400" width="280" height="40" fill="#ff4d5e"/><rect x="220" y="440" width="160" height="40" fill="#ff4d5e"/><rect x="280" y="480" width="40" height="40" fill="#ff4d5e"/>
<rect x="280" y="80" width="40" height="20" fill="#ffa3ac"/><rect x="220" y="100" width="80" height="20" fill="#ffa3ac"/><rect x="160" y="140" width="80" height="20" fill="#ffa3ac"/><rect x="120" y="180" width="40" height="60" fill="#ffa3ac"/>
<rect x="340" y="260" width="140" height="140" fill="#c9283a"/><rect x="320" y="400" width="120" height="40" fill="#c9283a"/><rect x="340" y="440" width="40" height="40" fill="#c9283a"/><rect x="400" y="180" width="60" height="80" fill="#c9283a"/>
<rect x="280" y="180" width="40" height="20" fill="#7a0f1e"/><rect x="240" y="200" width="120" height="20" fill="#7a0f1e"/><rect x="200" y="220" width="40" height="20" fill="#7a0f1e"/><rect x="360" y="220" width="40" height="20" fill="#7a0f1e"/>
