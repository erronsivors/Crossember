<rect x="260" y="360" width="80" height="20" fill="#7a0f1e"/>
<rect x="260" y="260" width="80" height="20" fill="#fff"/><rect x="260" y="280" width="20" height="20" fill="#fff"/><rect x="260" y="300" width="80" height="20" fill="#fff"/><rect x="320" y="320" width="20" height="20" fill="#fff"/><rect x="260" y="340" width="80" height="20" fill="#fff"/>
<rect x="240" y="260" width="20" height="100" fill="#fff" opacity="0"/>
<rect x="270" y="300" width="0" height="0"/>
</g>
<g fill="#ffd23f"><rect class="sp" x="60" y="140" width="20" height="60"/><rect class="sp" x="40" y="160" width="60" height="20"/><rect class="sp s2" x="500" y="80" width="20" height="60"/><rect class="sp s2" x="480" y="100" width="60" height="20"/><rect class="sp s2" x="520" y="400" width="20" height="20"/></g>
