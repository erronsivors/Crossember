<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:.8s}.t3{animation-delay:1.6s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.eye{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bob{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
</style>
