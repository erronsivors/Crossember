<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.sm{animation:rise 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.s2{animation-delay:1.5s}
@keyframes rise{0%{transform:translateY(10px) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-45px) scale(1.3);opacity:0}}
.br{animation:br 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.03,1.05)}}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:1.2s}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
</style>
