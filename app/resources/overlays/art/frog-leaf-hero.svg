<style>
.dr{animation:dr 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.4s}.d3{animation-delay:.8s}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}100%{transform:translateY(60px);opacity:0}}
.eye{animation:blink 3.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.lf{animation:sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
