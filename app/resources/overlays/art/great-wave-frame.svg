<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
<style>
.sp{animation:sp 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}
@keyframes sp{0%{transform:translate(0,10px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(-10px,-30px) scale(1);opacity:0}}
.wv{animation:wv 3.6s ease-in-out infinite}
@keyframes wv{0%,100%{transform:translateX(0)}50%{transform:translateX(-30px)}}
</style>
