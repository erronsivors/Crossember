<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.sp{animation:sp 3s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.p2{animation-delay:1s}.p3{animation-delay:2s}
@keyframes sp{0%{transform:translate(0,10px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(-14px,-34px) scale(1);opacity:0}}
.sea{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sun{animation:pl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
