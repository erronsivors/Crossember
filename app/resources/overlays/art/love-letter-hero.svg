<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.h{animation:up 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.h2{animation-delay:1s}.h3{animation-delay:2s}
@keyframes up{0%{transform:translateY(30px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.06)}}
</style>
