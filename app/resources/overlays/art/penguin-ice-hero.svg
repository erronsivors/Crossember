<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.rock{animation:rk 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sn{animation:sn 3s linear infinite;transform-box:fill-box;transform-origin:center}
.n2{animation-delay:1s}.n3{animation-delay:2s}
@keyframes sn{0%{transform:translateY(-30px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(60px) rotate(90deg);opacity:0}}
</style>
