<path class="fl f3" d="M210 372c-10-25 0-40 15-52 5 15 20 15 20 0 15 15 10 40 0 52zM960 372c10-25 0-40-15-52-5 15-20 15-20 0-15 15-10 40 0 52z" fill="#ff9a2e" stroke-width="7"/>
<rect x="120" y="105" width="960" height="265" rx="40" fill="#1d1612"/>
<rect x="140" y="125" width="920" height="225" rx="26" fill="none" stroke="#ff9a2e" stroke-width="5"/>
<path d="M300 372l20-28 20 28M600 372l20-28 20 28M860 372l20-28 20 28" fill="none" stroke="#e8441a" stroke-width="6" opacity="0"/>
