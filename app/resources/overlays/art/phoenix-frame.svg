</g>
<g fill="#ffe27a" stroke="#3a1206" stroke-width="4" stroke-linejoin="round">
<path class="sk" d="M70 190l6 13 13 6-13 6-6 13-6-13-13-6 13-6z"/>
<path class="sk k2" d="M1130 180l6 13 13 6-13 6-6 13-6-13-13-6 13-6z"/>
</g>
</svg>
