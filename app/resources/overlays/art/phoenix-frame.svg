<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
<style>
.fl{animation:fl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.f2{animation-delay:.5s}.f3{animation-delay:1s}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.2)}}
.sk{animation:sk 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.k2{animation-delay:1.3s}
@keyframes sk{0%{transform:translateY(14px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-40px) scale(1);opacity:0}}
</style>
<g stroke="#3a1206" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
