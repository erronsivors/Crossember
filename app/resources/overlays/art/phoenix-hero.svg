<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.wl{animation:wl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
.wr{animation:wr 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.fl{animation:fl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
.f2{animation-delay:.5s}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
.sk{animation:sk 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.k2{animation-delay:1.3s}
@keyframes sk{0%{transform:translateY(20px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-50px) scale(1);opacity:0}}
</style>
