<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.ch{animation:ch 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes ch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.st{animation:rise 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.s2{animation-delay:.9s}.s3{animation-delay:1.8s}
@keyframes rise{0%{transform:translateY(15px) scaleY(.6);opacity:0}30%{opacity:.7}100%{transform:translateY(-35px) scaleY(1.1);opacity:0}}
.eye{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
