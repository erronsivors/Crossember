<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" shape-rendering="crispEdges">
<style>
.bu{animation:bu 2.4s linear infinite;transform-box:fill-box}
.b2{animation-delay:.8s}.b3{animation-delay:1.6s}
@keyframes bu{0%{transform:translateY(40px);opacity:0}30%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.lq{animation:lq 1.6s steps(2) infinite}
@keyframes lq{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<rect x="120" y="540" width="360" height="20" fill="#000" opacity=".25"/>
<rect x="240" y="40" width="120" height="60" fill="#8a5a2a"/><rect x="240" y="40" width="20" height="60" fill="#c99654"/><rect x="260" y="40" width="80" height="20" fill="#c99654"/>
<rect x="220" y="100" width="160" height="40" fill="#cfe9f0"/><rect x="220" y="100" width="20" height="40" fill="#fff"/>
<rect x="240" y="140" width="120" height="100" fill="#cfe9f0"/>
<rect x="200" y="240" width="200" height="40" fill="#cfe9f0"/><rect x="160" y="280" width="280" height="40" fill="#cfe9f0"/>
<rect x="120" y="320" width="360" height="160" fill="#cfe9f0"/>
<rect x="160" y="480" width="280" height="40" fill="#cfe9f0"/><rect x="200" y="520" width="200" height="20" fill="#cfe9f0"/>
<rect x="240" y="200" width="120" height="40" fill="#1f5a2a"/>
<rect x="200" y="240" width="200" height="40" fill="#1f5a2a"/><rect x="160" y="280" width="280" height="40" fill="#1f5a2a"/>
<rect x="140" y="320" width="320" height="160" fill="#2f9a3f"/><rect x="160" y="480" width="280" height="30" fill="#2f9a3f"/><rect x="200" y="510" width="200" height="20" fill="#1f5a2a"/>
<g class="lq"><rect x="160" y="300" width="280" height="30" fill="#7dff6a"/><rect x="220" y="260" width="160" height="40" fill="#7dff6a"/><rect x="260" y="230" width="80" height="30" fill="#7dff6a"/></g>
<rect x="160" y="340" width="60" height="140" fill="#4fc858"/><rect x="400" y="440" width="40" height="40" fill="#1f7a30"/>
<rect x="120" y="320" width="20" height="160" fill="#fff" opacity=".6"/><rect x="140" y="340" width="20" height="40" fill="#fff" opacity=".6"/>
<rect x="220" y="100" width="20" height="40" fill="#fff"/>
<rect x="210" y="130" width="180" height="20" fill="#9ec0c8"/>
<g fill="#d9ffd0"><rect class="bu" x="240" y="400" width="30" height="30"/><rect class="bu b2" x="340" y="420" width="20" height="20"/><rect class="bu b3" x="290" y="440" width="20" height="20"/></g>
<g fill="#7dff6a"><rect class="bu b2" x="270" y="40" width="20" height="20" opacity=".8"/><rect class="bu b3" x="320" y="20" width="20" height="20"/></g>
</svg>
