<style>
.st{animation:rise 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;opacity:0}
.s2{animation-delay:.9s}.s3{animation-delay:1.8s}
@keyframes rise{0%{transform:translateY(20px) scaleY(.6);opacity:0}30%{opacity:.85}100%{transform:translateY(-40px) scaleY(1.1);opacity:0}}
.eye{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.chop{animation:ch 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 100%}
@keyframes ch{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
</style>
