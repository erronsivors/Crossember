<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.orb{animation:ob 4s linear infinite;transform-box:view-box;transform-origin:300px 320px}
@keyframes ob{to{transform:rotate(360deg)}}
.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:.7s}.t3{animation-delay:1.4s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.2);opacity:1}}
</style>
<defs><clipPath id="p"><circle cx="300" cy="320" r="170"/></clipPath>
<clipPath id="u"><rect x="0" y="0" width="600" height="320"/></clipPath></defs>
<g stroke="#1a1030" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
<g transform="rotate(-18 300 320)"><ellipse cx="300" cy="320" rx="285" ry="75" fill="none" stroke="#ffd9a8" stroke-width="40" clip-path="url(#u)" transform="rotate(18 300 320)"/></g>
<circle cx="300" cy="320" r="170" fill="#ff9a4a"/>
<g clip-path="url(#p)" stroke="none">
<path d="M120 250c60 20 120-5 180 5s120 10 180-10v50c-60 20-120 20-180 10s-120 10-180-10z" fill="#ffc07a"/>
<path d="M120 370c60 20 120 0 180 10s120 0 180-15v45c-60 15-120 15-180 5s-120 15-180-5z" fill="#e2702a"/>
<ellipse cx="380" cy="470" rx="170" ry="90" fill="#1a1030" opacity=".25"/>
<ellipse cx="230" cy="240" rx="40" ry="24" fill="#fff" opacity=".35"/>
</g>
<circle cx="300" cy="320" r="170" fill="none"/>
<g transform="rotate(-18 300 320)"><path d="M16 320c0 40 130 75 284 75s284-35 284-75" fill="none" stroke="#ffd9a8" stroke-width="40"/>
<path d="M16 320c0 40 130 75 284 75s284-35 284-75" fill="none" stroke="#c98a52" stroke-width="8" transform="translate(0 -12)"/></g>
</g>
<g class="orb"><circle cx="300" cy="55" r="30" fill="#bfd0f0" stroke="#1a1030" stroke-width="8"/><circle cx="292" cy="48" r="8" fill="#8aa0c8"/></g>
<g fill="#fff3a0" stroke="#1a1030" stroke-width="4" stroke-linejoin="round">
<path class="tw" d="M70 110l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/>
<path class="tw t2" d="M520 470l7 15 15 7-15 7-7 15-7-15-15-7 15-7z"/>
<path class="tw t3" d="M80 500l6 13 13 6-13 6-6 13-6-13-13-6 13-6z"/>
</g>
</svg>
