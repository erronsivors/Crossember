<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.p{animation:pf 3.6s ease-in infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.p2{animation-delay:1.2s}.p3{animation-delay:2.4s}
@keyframes pf{0%{transform:translate(0,-20px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-40px,120px) rotate(160deg);opacity:0}}
.sw{animation:sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
@keyframes sw{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
</style>
