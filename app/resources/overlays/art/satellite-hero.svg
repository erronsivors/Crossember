<path d="M300 200v-70" fill="none" stroke-width="8"/>
<circle cx="300" cy="120" r="14" fill="#ff5a7a" stroke-width="7"/>
</g>
<g fill="none" stroke="#5fd4ff" stroke-width="9" stroke-linecap="round">
