<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.sg{animation:sg 2.4s ease-in-out infinite}
.g2{animation-delay:.5s}.g3{animation-delay:1s}
@keyframes sg{0%,100%{opacity:.15}50%{opacity:1}}
.ft{animation:ft 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ft{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-9deg) translateY(-12px)}}
.ld{animation:ld 1.2s steps(1) infinite}
@keyframes ld{0%{fill:#7dff9b}50%{fill:#1a5a2a}}
</style>
<g class="ft" stroke="#0c1a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
