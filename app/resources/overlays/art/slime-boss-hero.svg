<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" shape-rendering="crispEdges">
<style>
.jp{animation:jp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes jp{0%,100%{transform:scale(1.04,.94)}50%{transform:translateY(-30px) scale(.96,1.06)}}
.sh{animation:sh 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8);opacity:.15}}
.ey{animation:ey 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ey{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
<rect class="sh" x="100" y="545" width="400" height="20" fill="#000" opacity=".3"/>
<g class="jp">
<rect x="240" y="120" width="120" height="40" fill="#1a6a32"/><rect x="180" y="160" width="240" height="40" fill="#1a6a32"/><rect x="140" y="200" width="320" height="40" fill="#1a6a32"/>
<rect x="100" y="240" width="400" height="280" fill="#1a6a32"/><rect x="80" y="320" width="440" height="160" fill="#1a6a32"/><rect x="140" y="520" width="320" height="30" fill="#1a6a32"/>
<rect x="260" y="140" width="80" height="20" fill="#6dff8e"/><rect x="200" y="160" width="200" height="40" fill="#6dff8e"/><rect x="160" y="200" width="280" height="40" fill="#6dff8e"/>
<rect x="120" y="240" width="360" height="270" fill="#6dff8e"/><rect x="100" y="320" width="400" height="150" fill="#6dff8e"/><rect x="160" y="510" width="280" height="20" fill="#6dff8e"/>
<rect x="320" y="400" width="180" height="80" fill="#3fc962"/><rect x="280" y="470" width="160" height="50" fill="#3fc962"/><rect x="440" y="320" width="40" height="80" fill="#3fc962"/>
<rect x="200" y="180" width="80" height="20" fill="#d2ffdc"/><rect x="160" y="220" width="20" height="40" fill="#d2ffdc"/><rect x="140" y="260" width="20" height="60" fill="#d2ffdc"/>
<g class="ey"><rect x="200" y="300" width="60" height="80" fill="#0e3a1c"/><rect x="340" y="300" width="60" height="80" fill="#0e3a1c"/>
<rect x="220" y="310" width="20" height="30" fill="#fff"/><rect x="360" y="310" width="20" height="30" fill="#fff"/></g>
<rect x="260" y="400" width="80" height="20" fill="#0e3a1c"/><rect x="240" y="380" width="20" height="20" fill="#0e3a1c"/><rect x="340" y="380" width="20" height="20" fill="#0e3a1c"/>
<rect x="160" y="400" width="40" height="20" fill="#ff8fa8" opacity=".7"/><rect x="400" y="400" width="40" height="20" fill="#ff8fa8" opacity=".7"/>
<rect x="200" y="60" width="200" height="60" fill="#8a5d00"/><rect x="180" y="40" width="40" height="40" fill="#8a5d00"/><rect x="380" y="40" width="40" height="40" fill="#8a5d00"/><rect x="280" y="30" width="40" height="40" fill="#8a5d00"/>
<rect x="210" y="80" width="180" height="30" fill="#ffd23f"/><rect x="190" y="50" width="20" height="30" fill="#ffd23f"/><rect x="390" y="50" width="20" height="30" fill="#ffd23f"/><rect x="290" y="40" width="20" height="30" fill="#ffd23f"/>
<rect x="210" y="80" width="40" height="10" fill="#fff3a0"/><rect x="290" y="90" width="20" height="20" fill="#e8262b"/><rect x="230" y="90" width="10" height="10" fill="#3ff2ff"/><rect x="360" y="90" width="10" height="10" fill="#3ff2ff"/>
</g>
