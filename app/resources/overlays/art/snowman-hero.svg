.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sc{animation:sw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 0%}
@keyframes sw{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
</style>
