</g>
<g stroke="#0a1a1e" stroke-width="5"><circle class="ld" cx="230" cy="386" r="9"/><circle class="ld l2" cx="330" cy="388" r="9"/><circle class="ld l3" cx="430" cy="390" r="9"/><circle class="ld" cx="770" cy="390" r="9"/><circle class="ld l2" cx="870" cy="388" r="9"/><circle class="ld l3" cx="970" cy="386" r="9"/></g>
