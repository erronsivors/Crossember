.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:.9s}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}
</style>
<g stroke-linejoin="round" stroke-linecap="round">
