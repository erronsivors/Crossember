<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<style>
.wb{animation:wb 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wb{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-12px)}}
.ld{animation:ld 1.2s steps(1) infinite}
.l2{animation-delay:.4s}.l3{animation-delay:.8s}
@keyframes ld{0%{fill:#fff3a0}50%{fill:#ff5a8a}}
.cn{animation:cn 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cn{0%,100%{transform:translateY(20px) scaleX(1)}50%{transform:translateY(-20px) scaleX(.2)}}
.bm{animation:bm 3s ease-in-out infinite}
@keyframes bm{0%,100%{opacity:.55}50%{opacity:.9}}
</style>
<path class="bm" d="M230 370L120 565h360L370 370z" fill="#a8ffc0" opacity=".6"/>
<g class="cn"><circle cx="300" cy="500" r="36" fill="#ffd23f" stroke="#0e2a36" stroke-width="8"/><path d="M300 480v40" stroke="#c88a14" stroke-width="7" stroke-linecap="round"/></g>
<g class="wb" stroke="#0e2a36" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
<path d="M210 280c0-110 180-110 180 0z" fill="#bfeeff" fill-opacity=".85"/>
<ellipse cx="300" cy="290" rx="35" ry="40" fill="#5be08a" stroke-width="7"/>
<ellipse cx="287" cy="285" rx="9" ry="14" fill="#0e2a36" stroke="none"/><ellipse cx="313" cy="285" rx="9" ry="14" fill="#0e2a36" stroke="none"/>
<path d="M290 310c6 6 14 6 20 0" fill="none" stroke-width="5"/>
<path d="M300 252v-30" fill="none" stroke-width="6"/><circle cx="300" cy="215" r="9" fill="#ff5a8a" stroke-width="5"/>
<path d="M240 200c15-25 45-35 70-30" fill="none" stroke="#fff" stroke-width="7" stroke-opacity=".8"/>
<path d="M40 330c0-40 120-60 260-60s260 20 260 60c0 40-120 70-260 70S40 370 40 330z" fill="#8aa0c4"/>
<path d="M70 345c40 25 120 35 230 35s190-10 230-35" fill="none" stroke="#5a7099" stroke-width="10"/>
<circle class="ld" cx="130" cy="345" r="16" stroke-width="6"/><circle class="ld l2" cx="215" cy="365" r="16" stroke-width="6"/>
<circle class="ld l3" cx="300" cy="372" r="16" stroke-width="6"/><circle class="ld" cx="385" cy="365" r="16" stroke-width="6"/>
<circle class="ld l2" cx="470" cy="345" r="16" stroke-width="6"/>
</g>
