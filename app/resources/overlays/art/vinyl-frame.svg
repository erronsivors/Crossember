<circle cx="1100" cy="385" r="46" fill="none" stroke="#2c2c3a" stroke-width="4"/>
<circle cx="1100" cy="385" r="24" fill="#ff5a7a" stroke-width="5"/>
<path d="M1100 325a60 60 0 0 1 40 14" fill="none" stroke="#8a8aa8" stroke-width="6"/>
<circle cx="1100" cy="385" r="5" fill="#14141c" stroke="none"/></g>
</g>
<g fill="none" stroke="#ff5a7a" stroke-width="7" stroke-linecap="round" class="nt"><path d="M320 40v-24l20-4v24"/></g>
<g fill="none" stroke="#ffcc33" stroke-width="7" stroke-linecap="round" class="nt n2"><path d="M700 40v-24l20-4v24"/></g>
