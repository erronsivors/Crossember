<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
<style>
.rec{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.nt{animation:nt 3s ease-out infinite;opacity:0}
.n2{animation-delay:1.5s}
@keyframes nt{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
</style>
<g stroke="#0d0d14" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
