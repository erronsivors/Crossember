<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Ставки</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; padding: .9em 1.1em 1em; transition: opacity .45s ease, transform .55s cubic-bezier(.2, .9, .3, 1); }
  #stage.empty { display: none; }
  #stage.hide { opacity: 0; transform: translateY(-.8em); }
  .top { display: flex; align-items: baseline; gap: .8em; margin-bottom: .2em; }
  .kick { font: 800 .55em 'Manrope', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--kicker); }
  .state { font: 600 .6em 'Manrope', sans-serif; color: var(--muted); }
  .clock { margin-left: auto; font: 800 1.25em var(--title); font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .q { font: 800 1.05em var(--title); line-height: 1.2; margin: .15em 0 .6em; word-break: break-word; }
  /* Банк исходов — одна полоса, разделённая по долям */
  .split { display: flex; height: .55em; border-radius: 1em; overflow: hidden; background: rgba(255, 255, 255, .08); margin: .1em 0 .7em; }
  .split i { display: block; height: 100%; transition: flex-grow .7s cubic-bezier(.2, .8, .3, 1); min-width: 2px; }
  .outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(9em, 1fr)); gap: .6em; }
  .out { padding: .55em .7em .6em; border-radius: 12px; background: rgba(255, 255, 255, .05); border-top: 3px solid var(--c); min-width: 0; }
  .out.win { background: rgba(255, 255, 255, .12); box-shadow: 0 0 0 2px var(--c); }
  .out.lose { opacity: .45; }
  .on { display: flex; gap: .45em; align-items: baseline; }
  .num { flex: none; font: 800 .62em 'Manrope', sans-serif; color: var(--c); }
  .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pool { font: 800 1.05em var(--title); font-variant-numeric: tabular-nums; margin-top: .15em; }
  .meta { font: 600 .58em 'Manrope', sans-serif; color: var(--muted); display: flex; gap: .8em; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .coef { color: var(--fg); font-weight: 800; }
  .tops { margin-top: .35em; font: 600 .55em 'Manrope', sans-serif; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { margin-top: .65em; font: 600 .6em 'Manrope', sans-serif; color: var(--muted); display: flex; flex-wrap: wrap; gap: .3em 1em; }
  .foot b { color: var(--fg); font-weight: 800; }
  .res { margin-top: .6em; text-align: center; font: 800 .9em var(--title); animation: rise .8s cubic-bezier(.2, 1.2, .4, 1); }
  .res small { display: block; font: 600 .6em 'Manrope', sans-serif; color: var(--muted); margin-top: .2em; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(.6em) scale(.96); } 100% { opacity: 1; transform: none; } }
</style></head>
<body class="t-general"><div id="stage" class="card empty"></div>
<script src="/a/overlay.js"></script><script src="/a/bets.js"></script>
</body></html>
