<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Сабатон</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; text-align: center; padding: .25em .5em .35em; }
  #stage.empty { display: none; }
  .kick { font: 800 .22em 'Manrope', sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--kicker); }
  .kick b { color: var(--accent); }
  .clock { font: 800 1em var(--title); font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
  .clock.paused { opacity: .5; }
  .clock.low { color: var(--accent); }
  .sub { font: 600 .2em 'Manrope', sans-serif; color: var(--muted); }
  #adds { position: absolute; left: 0; right: 0; top: 100%; height: 0; }
  .add { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; font: 800 .3em var(--title); color: var(--fg);
    text-shadow: 0 2px 8px rgba(0, 0, 0, .7); animation: fly 3s cubic-bezier(.2, .9, .3, 1) forwards; }
  .add small { font: 600 .7em 'Manrope', sans-serif; color: var(--muted); margin-left: .4em; }
  @keyframes fly { 0% { opacity: 0; transform: translate(-50%, .6em); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -.4em); } }
</style></head>
<body class="t-general"><div id="stage" class="card empty"><div class="kick" id="kick">Сабатон</div><div class="clock" id="clock">0:00:00</div><div class="sub" id="sub"></div><div id="adds"></div></div>
<script src="/a/overlay.js"></script><script src="/a/subathon.js"></script>
</body></html>
