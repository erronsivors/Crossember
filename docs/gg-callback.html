<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Crossember — вход в GoodGame</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16110d; color: #f3e7d8; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 1.5rem; text-align: center; }
  a { color: #ffb067; }
</style>
</head>
<body>
<main>
  <h2 id="t">Возвращаемся в Crossember…</h2>
  <p id="m">Если ничего не происходит, убедитесь, что Crossember открыт и вы нажали в нём «Войти в GoodGame».</p>
</main>
<script>
  // GoodGame не разрешает возвращать вход на localhost, поэтому он приходит сюда, а страница сразу передаёт
  // одноразовый код программе Crossember на этом же компьютере. Без секрета приложения код бесполезен; ничего не сохраняется.
  (function () {
    var q = new URLSearchParams(location.search);
    var out = new URLSearchParams();
    var ok = /^[\w.~+\/=-]{1,4000}$/;
    ['code', 'state', 'error'].forEach(function (k) {
      var v = q.get(k);
      if (v && ok.test(v)) out.set(k, v);
    });
    history.replaceState(null, '', location.pathname);
    if (!out.get('state')) {
      document.getElementById('t').textContent = 'Вход не удался';
      document.getElementById('m').textContent = 'Вернитесь в Crossember и нажмите «Войти в GoodGame» ещё раз.';
      return;
    }
    location.replace('http://127.0.0.1:47837/callback?' + out.toString());
  })();
</script>
</body>
</html>
